name: Deploy Dev
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write      
  id-token: write   

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main (Production Base)
        uses: actions/checkout@v4
        with:
          ref: main
          path: staging

      - name: Checkout Dev Branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev_code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Nest Dev Environment
        run: |
          cd dev_code
          npm ci
          node build.mjs
          mkdir -p ../staging/dev
          cp -r dist/* ../staging/dev/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './staging'
